<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Útvonal térkép</title>

    <!-- Leaflet CSS -->
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<!-- Leaflet JS -->
<script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
></script>

<script>
    var map = null;
    var routeLayer = null;

    var departureIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    var arrivalIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    function initMap() {
        if (map !== null) return;

        map = L.map('map', {
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false
        }).setView([47.0, 19.0], 5);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        routeLayer = L.layerGroup().addTo(map);
    }

    window.onload = function() {
        initMap();
    };

    // Java-ból meghívva: connectAirports(lat1, lon1, lat2, lon2)
    function connectAirports(lat1, lon1, lat2, lon2) {
        if (map === null || routeLayer === null) {
            initMap();
        }
        if (map === null || routeLayer === null) {
            console.log("Map vagy routeLayer nem elérhető.");
            return;
        }

        map.invalidateSize();

        // előző útvonal + markerek törlése
        routeLayer.clearLayers();

        var p1 = [lat1, lon1]; // induló
        var p2 = [lat2, lon2]; // érkező

        var depMarker = L.marker(p1, {icon: departureIcon})
            .bindPopup("Indulás");
        depMarker.addTo(routeLayer);

        var arrMarker = L.marker(p2, {icon: arrivalIcon})
            .bindPopup("Érkezés");
        arrMarker.addTo(routeLayer);

        var route = L.polyline([p1, p2], {
            color: 'red',
            weight: 4
        }).addTo(routeLayer);

        map.fitBounds(route.getBounds(), {padding: [50, 50]});
    }
</script>
</body>
</html>
