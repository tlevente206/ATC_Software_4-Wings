<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Térkép</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    L_DISABLE_3D = true;

    // Térkép létrehozása (animációk kikapcsolásával a stabilitásért)
    var map = L.map('map', {
        zoomAnimation: false,    // Animációk kikapcsolása
        fadeAnimation: false,
        markerZoomAnimation: false
    }).setView([48.0, 15.0], 4);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function connectAirports(lat1, lon1, lat2, lon2) {
        // Méret kényszerített frissítése (ha az ablak átméreteződött)
        map.invalidateSize();

        var point1 = [lat1, lon1];
        var point2 = [lat2, lon2];

        // Térkép tisztítása (hogy ne maradjanak ott a régi vonalak)
        map.eachLayer(function (layer) {
            // Csak a jelölőket és vonalakat töröljük, a térkép csempéket ne
            if (layer instanceof L.Marker || layer instanceof L.Polyline) {
                map.removeLayer(layer);
            }
        });

        // Markerek
        L.marker(point1).addTo(map).bindPopup("Indulás").openPopup();
        L.marker(point2).addTo(map).bindPopup("Érkezés");

        // Vonal
        var route = L.polyline([point1, point2], {color: 'red', weight: 4}).addTo(map);

        // Zoomolás
        map.fitBounds(route.getBounds(), {padding: [50, 50]});
    }
</script>
</body>
</html>
