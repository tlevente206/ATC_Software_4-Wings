<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Időjárási térkép</title>

    <!-- Leaflet CSS -->
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
    />

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-pane,
        .leaflet-map-pane,
        .leaflet-tile,
        .leaflet-marker-icon,
        .leaflet-marker-shadow,
        .leaflet-tile-container,
        .leaflet-objects-pane,
        .leaflet-shadow-pane,
        .leaflet-overlay-pane,
        .leaflet-marker-pane,
        .leaflet-popup-pane {
            transform: none !important;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    // 3D tiltása, hogy JavaFX WebView-val is stabil legyen
    window.L_DISABLE_3D = true;
    window.L_NO_TOUCH = false;
</script>

<!-- Leaflet JS -->
<script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
></script>

<script>
    var map = null;
    var airportLayer = null;

    function initMap() {
        if (map !== null) return;

        map = L.map('map', {
            preferCanvas: true,
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false
        }).setView([47.0, 19.0], 5);

        // Alaptérkép
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 10,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // (OPCIONÁLIS) OpenWeather csapadék overlay – ha akarod, írd be az API kulcsod:
        // L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=IDE_IRD_AZ_API_KEYT', {
        //     maxZoom: 10,
        //     opacity: 0.6
        // }).addTo(map);

        airportLayer = L.layerGroup().addTo(map);

        setTimeout(function () {
            map.invalidateSize();
        }, 200);
    }

    function resizeMap() {
        var div = document.getElementById('map');
        if (!div) return;
        div.style.width = '100%';
        div.style.height = '100%';
        if (map) {
            map.invalidateSize();
        }
    }

    window.addEventListener('load', function () {
        resizeMap();
        initMap();
    });

    window.addEventListener('resize', function () {
        resizeMap();
    });

    // JAVA-ból hívjuk: showAirport(lat, lon, label)
    function showAirport(lat, lon, label) {
        if (map === null || airportLayer === null) {
            initMap();
        }
        if (map === null || airportLayer === null) {
            console.log("Időjárási térkép: map vagy airportLayer nem elérhető.");
            return;
        }

        resizeMap();
        airportLayer.clearLayers();

        var pos = [lat, lon];

        // Zöld pont a reptérre
        var marker = L.circleMarker(pos, {
            radius: 7,
            color: '#22c55e',
            fillColor: '#22c55e',
            fillOpacity: 0.9
        }).addTo(airportLayer);

        if (label) {
            marker.bindPopup(label);
        }

        map.setView(pos, 7);
    }
</script>
</body>
</html>
